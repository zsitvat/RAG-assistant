[project]
name = "rag-assistant"
version = "0.1.0"
description = "Agentic RAG prototype: corporate expense reimbursement and employee benefits assistant"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.141.1",
    "httpx2==2.9.1",
    "langchain==1.3.14",
    "langchain-core==1.5.3",
    "langchain-huggingface==1.2.2",
    "langchain-ollama==1.1.0",
    "langchain-redis==0.2.5",
    "langchain-text-splitters==1.1.2",
    "langfuse>=4.14.2",
    "langgraph==1.2.10",
    "langgraph-checkpoint-redis>=0.5.1",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "python-docx==1.2.0",
    "pyyaml==6.0.3",
    "redis==7.4.1",
    "sentence-transformers==5.6.1",
    "streamlit==1.60.0",
    "torch==2.6.0",
    "uvicorn[standard]==0.52.0",
]

[dependency-groups]
dev = [
    "bandit==1.9.4",
    "pysonar==1.7.0.5143",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "ruff==0.16.0",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["src/app"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["app"]
omit = [
    "src/app/ui.py",
    "src/app/agent/tests/*",
    "src/app/rag/tests/*",
    "src/app/rag/ingest/tests/*",
    "src/app/rules/tests/*",
    "src/app/integrations/tests/*",
    "src/app/logging/tests/*",
    "src/app/tests/*",
    "src/app/tests/api/*",
    "src/app/tests/journeys/*",
]
