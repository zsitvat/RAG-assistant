services:
  redis:
    image: redis:8.8.1
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis8_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5m
      timeout: 3s
      retries: 3
      start_period: 10s

  redisinsight:
    image: redis/redisinsight:3.6.0
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      RI_REDIS_HOST: redis
      RI_REDIS_PORT: "6379"
      RI_REDIS_ALIAS: RAG assistant
    ports:
      - "127.0.0.1:5540:5540"
    volumes:
      - redisinsight_data:/data

volumes:
  redis8_data:
  redisinsight_data:
